name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão sem o prefixo v (ex.: 0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build Linux binaries
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "dist/docktop-linux-${arch}" ./cmd/docktop
          done

      - name: Create checksum manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          {
            printf 'version %s\n' "$VERSION"
            for asset in docktop-linux-amd64 docktop-linux-arm64; do
              printf '%s %s\n' \
                "$asset" \
                "$(sha256sum "dist/$asset" | awk '{print $1}')"
            done
          } > dist/manifest.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/docktop-linux-amd64 \
              dist/docktop-linux-arm64 \
              dist/manifest.txt \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/docktop-linux-amd64 \
              dist/docktop-linux-arm64 \
              dist/manifest.txt \
              --title "DockTop $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Check out website
        uses: actions/checkout@v4
        with:
          repository: gustavoohrodrigues/docktop-website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Update website downloads
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          cp dist/docktop-linux-amd64 website/downloads/
          cp dist/docktop-linux-arm64 website/downloads/

          installer_hash="$(
            awk '$1 == "docktop.sh" { print $2; exit }' \
              website/downloads/manifest.txt
          )"
          update_check_hash="$(
            awk '$1 == "update-check.sh" { print $2; exit }' \
              website/downloads/manifest.txt
          )"
          {
            printf 'version %s\n' "$VERSION"
            for asset in docktop-linux-amd64 docktop-linux-arm64; do
              printf '%s %s\n' \
                "$asset" \
                "$(sha256sum "website/downloads/$asset" | awk '{print $1}')"
            done
            printf 'docktop.sh %s\n' "$installer_hash"
            printf 'update-check.sh %s\n' "$update_check_hash"
          } > website/downloads/manifest.txt

      - name: Publish website downloads
        working-directory: website
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          if git diff --cached --quiet; then
            echo "Website downloads are already current."
            exit 0
          fi
          git commit -m "Atualiza DockTop para ${RELEASE_TAG}"
          git push origin HEAD:main

      - name: Trigger Vercel deployment
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -n "$VERCEL_DEPLOY_HOOK_URL" ]]; then
            curl --fail --silent --show-error \
              --request POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "No deploy hook configured; relying on Vercel Git Integration."
          fi
