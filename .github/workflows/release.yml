name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build Linux binaries
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "dist/docktop-linux-${arch}" ./cmd/docktop
          done

      - name: Create checksum manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          {
            printf 'version %s\n' "$VERSION"
            for asset in docktop-linux-amd64 docktop-linux-arm64; do
              printf '%s %s\n' \
                "$asset" \
                "$(sha256sum "dist/$asset" | awk '{print $1}')"
            done
          } > dist/manifest.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/docktop-linux-*"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/docktop-linux-amd64 \
            dist/docktop-linux-arm64 \
            dist/manifest.txt \
            --title "DockTop $RELEASE_TAG" \
            --generate-notes \
            --verify-tag

      - name: Check out website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: gustavoohrodrigues/docktop-website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Update website downloads
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          install -m 0755 dist/docktop-linux-amd64 website/downloads/docktop-linux-amd64
          install -m 0755 dist/docktop-linux-arm64 website/downloads/docktop-linux-arm64

          installer_hash="$(sha256sum website/docktop.sh | awk '{print $1}')"
          update_check_hash="$(sha256sum website/update-check.sh | awk '{print $1}')"
          {
            printf 'version %s\n' "$VERSION"
            for asset in docktop-linux-amd64 docktop-linux-arm64; do
              printf '%s %s\n' \
                "$asset" \
                "$(sha256sum "website/downloads/$asset" | awk '{print $1}')"
            done
            printf 'docktop.sh %s\n' "$installer_hash"
            printf 'update-check.sh %s\n' "$update_check_hash"
          } > website/downloads/manifest.txt

      - name: Publish website downloads
        working-directory: website
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          if git diff --cached --quiet; then
            echo "Website downloads are already current."
            exit 0
          fi
          git commit -m "Atualiza DockTop para ${RELEASE_TAG}"
          git push origin HEAD:main
