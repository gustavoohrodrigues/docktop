version: 2
project_name: docktop
builds:
  - main: ./cmd/docktop
    binary: docktop
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: [-s -w -X main.version={{.Version}}]
archives:
  - formats: [tar.gz]
checksum:
  name_template: checksums.txt
changelog:
  use: git
